name: CodeQL Full Scan

on:
  schedule:
    - cron: '34 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: read
  actions: read

jobs:
  detect:
    name: Detect CodeQL languages
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build matrix
        id: matrix
        shell: bash
        run: |
          matrix=$(bash .github/scripts/codeql-matrix.sh manual)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  analyze:
    needs: detect
    name: Full scan (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-full-config.yml

      - name: Build project
        if: matrix.language == 'java-kotlin'
        run: mvn -B clean test-compile -DskipTests -Dcheckstyle.skip=true -Dpmd.skip=true -Dspotbugs.skip=true -Dcpd.skip=true

      - name: Perform CodeQL Analysis
        id: codeql-analysis
        uses: github/codeql-action/analyze@v4
        with:
          output: ${{ runner.temp }}/codeql-results
          post-processed-sarif-path: ${{ runner.temp }}/codeql-results-processed
          upload: always
          category: "/codeql-full:${{ matrix.language }}"

      - name: Collect CodeQL SARIF reports
        if: always()
        shell: bash
        env:
          CODEQL_OUTPUT: ${{ runner.temp }}/codeql-results
          CODEQL_PROCESSED_OUTPUT: ${{ runner.temp }}/codeql-results-processed
          CODEQL_SARIF_OUTPUT: ${{ steps.codeql-analysis.outputs.sarif-output }}
        run: |
          rm -rf codeql-sarif
          mkdir -p codeql-sarif

          {
            printf 'language=%s\n' '${{ matrix.language }}'
            printf 'codeql_output=%s\n' "$CODEQL_OUTPUT"
            printf 'post_processed_output=%s\n' "$CODEQL_PROCESSED_OUTPUT"
            printf 'action_sarif_output=%s\n' "$CODEQL_SARIF_OUTPUT"
            printf '\nGenerated SARIF files:\n'
          } > codeql-sarif/scan-files.txt

          for directory in "$CODEQL_OUTPUT" "$CODEQL_PROCESSED_OUTPUT" "$CODEQL_SARIF_OUTPUT"; do
            if [[ -n "$directory" && -d "$directory" ]]; then
              find "$directory" -type f -name '*.sarif' -print0 |
                while IFS= read -r -d '' file; do
                  cp "$file" "codeql-sarif/$(basename "$file")"
                  printf '%s\n' "$file" >> codeql-sarif/scan-files.txt
                done
            fi
          done

          find "$RUNNER_TEMP" -type f -name '*.sarif' -print0 |
            while IFS= read -r -d '' file; do
              target="codeql-sarif/$(basename "$file")"
              if [[ ! -e "$target" ]]; then
                cp "$file" "$target"
                printf '%s\n' "$file" >> codeql-sarif/scan-files.txt
              fi
            done

      - name: Upload CodeQL SARIF report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-full-sarif-${{ matrix.language }}
          path: codeql-sarif
          if-no-files-found: error
          retention-days: 30
