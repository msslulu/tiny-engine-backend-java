name: Code Quality Checks

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  static-analysis:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-  

      - name: Run Checkstyle
        id: checkstyle
        continue-on-error: true
        run: bash .github/scripts/checkstyle-pr.sh
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Compile project
        run: mvn compile -DskipTests

      - name: Run PMD (including CPD)
        id: pmd
        run: mvn pmd:check pmd:cpd-check

      - name: Run SpotBugs
        id: spotbugs
        run: mvn spotbugs:check

      - name: Debug reports
        if: always()
        run: |
          echo "Current directory: $(pwd)"
          echo "=== Find all report files ==="
          find . -type f \( -name "checkstyle-result.xml" -o -name "pmd.xml" -o -name "cpd.xml" -o -name "spotbugsXml.xml" \)

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: |
            **/target/checkstyle-result.xml
            **/target/checkstyle-checker.xml
            **/target/reports/
            **/target/pmd.xml
            **/target/cpd.xml
            **/target/spotbugsXml.xml
          if-no-files-found: warn